<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <h1>Card Game</h1>
    <div id="game-board">
      <!-- Dynamic cards and elements will be inserted here -->
    </div>
    <div id="controls">
      <button id="play-card-btn">Play Selected Card</button>
      <button id="next-round-btn">Next Round</button>
    </div>
    <div id="shop-container">
      <h2>Shop</h2>
      <div id="shop-items">
        <!-- Shop items will be dynamically inserted here by game_logic.js -->
      </div>
    </div>
    <div id="game-stats">
      <!-- Stats like player coins, score, etc. -->
    </div>
  </div>
  <script src="game_logic.js" type="module"></script>
  <script src="script.js" type="module"></script>
</body>
</html>
